<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="THE DAILY SIGNAL: daily stories, market closes, exchange rates, and Hsinchu weather.">
  <meta name="theme-color" content="#e9dfc6">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://api.open-meteo.com https://api.frankfurter.dev https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>THE DAILY SIGNAL</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/press.css?v=52e9e1907618">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Pirata+One&amp;family=UnifrakturMaguntia&amp;display=swap">
  <script src="assets/js/app.js?v=7023b55c1484" defer></script>
  <script src="assets/js/press.js?v=607aa5758388" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to edition</a>
  <div class="paper">
    <header class="masthead">
      <div class="masthead-title"><span class="press-seal" aria-hidden="true">✦</span><h1><a href="./" class="latest-link">The Daily Signal</a></h1><span class="press-seal" aria-hidden="true">✦</span></div>
      <div class="dateline">
        <span id="edition-number">NO. —</span>
        <time id="edition-date" tabindex="-1">Loading edition</time>
        <span>Updated <time id="updated-time">—</time><span class="timezone"> Taipei time</span></span>
      </div>
    </header>
    <nav class="reader-nav" aria-label="Newspaper navigation">
      <a href="./" class="latest-link">Latest <span aria-hidden="true">↗</span></a>
      <a href="#archive">Archive <span aria-hidden="true">↓</span></a>
    </nav>
    <main id="main" tabindex="-1" aria-busy="true">
      <noscript><p class="notice">JavaScript is required to load edition JSON. This site does not use tracking scripts.</p></noscript>
      <section id="message" class="notice" role="status" tabindex="-1" aria-labelledby="message-title">
        <p class="eyebrow">FROM THE READING ROOM</p>
        <h2 id="message-title">Loading edition…</h2>
        <p id="message-detail">Loading catalogs and edition content.</p>
        <button id="retry-latest" type="button" hidden>Return to latest</button>
      </section>
      <div id="edition-panel" hidden>
        <section id="channel-status" class="channel-status" aria-label="Source limitations or loading errors" hidden></section>
        <section class="dispatches" aria-labelledby="dispatches-title">
          <div class="section-heading"><h2 id="dispatches-title">THE DISPATCHES</h2></div>
          <div id="dispatch-board" class="dispatch-board" aria-label="Market, exchange-rate, and Hsinchu weather information">
            <section id="dispatch-tw" class="dispatch-card" aria-label="Previous Taiwan market close" aria-live="polite"></section>
            <section id="dispatch-us" class="dispatch-card" aria-label="Previous U.S. market close" aria-live="polite"></section>
            <section id="dispatch-fx" class="dispatch-card" aria-label="TWD and USD exchange rate" aria-live="polite"></section>
            <section id="dispatch-weather" class="dispatch-card" aria-label="Hsinchu weather" aria-live="polite"></section>
          </div>
        </section>
        <section class="reading-tools" aria-labelledby="tools-title">
          <h2 id="tools-title" class="visually-hidden">Search and filter this edition</h2>
          <form id="search-form" role="search">
            <div class="search-field"><label for="search-input">SEARCH</label><input id="search-input" type="search" placeholder="Keyword, topic, or source…" autocomplete="off" maxlength="200"></div>
            <div><label for="section-filter">SECTION</label><select id="section-filter"><option value="">All sections</option></select></div>
            <div><label for="kind-filter">SOURCE TYPE</label><select id="kind-filter"><option value="">All types</option></select></div>
            <button id="reset-filters" type="button">CLEAR</button>
          </form>
          <details id="topic-index" class="topic-index"><summary>TOPIC INDEX <span id="tag-total"></span></summary><div id="tag-filters" class="tag-filters" role="group" aria-label="Choose a topic tag"></div></details>
        </section>
        <section class="stories-section" aria-label="Stories">
          <p id="results-count" role="status" aria-live="polite" aria-atomic="true"></p>
          <div id="stories" class="news-grid"></div>
          <p id="empty-results" class="empty-results" hidden></p>
        </section>
      </div>
    </main>
    <details id="archive" class="archive">
      <summary>THE ARCHIVE <span id="archive-count"></span></summary>
      <nav aria-label="Edition archive"><ol id="archive-list"></ol></nav>
    </details>
    <footer class="colophon"><p class="footer-brand">THE DAILY SIGNAL</p><p><a href="#top" id="back-top">Back to top ↑</a></p></footer>
  </div>
</body>
</html>
