<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="THE DAILY SIGNAL：每日情報、股市收盤、匯率與新竹天氣。">
  <meta name="theme-color" content="#e9dfc6">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://api.open-meteo.com https://api.frankfurter.dev https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>THE DAILY SIGNAL</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/press.css?v=cb5f85284a07">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Pirata+One&amp;family=UnifrakturMaguntia&amp;display=swap">
  <script src="assets/js/app.js?v=b7d7526e0653" defer></script>
  <script src="assets/js/press.js?v=bd8a1dc94259" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳至本期內容</a>
  <div class="paper">
    <header class="masthead">
      <div class="masthead-title"><span class="press-seal" aria-hidden="true">✦</span><h1 lang="en"><a href="./" class="latest-link">The Daily Signal</a></h1><span class="press-seal" aria-hidden="true">✦</span></div>
      <div class="dateline">
        <span id="edition-number">NO. —</span>
        <time id="edition-date" tabindex="-1">調閱本期中</time>
        <span>更新 <time id="updated-time">—</time><span class="timezone"> 台北時間</span></span>
      </div>
    </header>
    <nav class="reader-nav" aria-label="報紙導覽">
      <a href="./" class="latest-link">最新一期 <span aria-hidden="true">↗</span></a>
      <a href="#archive">往期存檔 <span aria-hidden="true">↓</span></a>
    </nav>
    <main id="main" tabindex="-1" aria-busy="true">
      <noscript><p class="notice">閱讀器需要 JavaScript 才能調閱 JSON。請啟用 JavaScript 後重新整理；本網站不使用追蹤程式。</p></noscript>
      <section id="message" class="notice" role="status" tabindex="-1" aria-labelledby="message-title">
        <p class="eyebrow" lang="en">FROM THE READING ROOM</p>
        <h2 id="message-title">正在調閱本期…</h2>
        <p id="message-detail">讀取目錄與當期內容。</p>
        <button id="retry-latest" type="button" hidden>返回最新一期</button>
      </section>
      <div id="edition-panel" hidden>
        <section id="channel-status" class="channel-status" aria-label="來源限制或讀取錯誤" hidden></section>
        <section class="reading-tools" aria-labelledby="tools-title">
          <h2 id="tools-title" class="visually-hidden">搜尋與篩選本期</h2>
          <form id="search-form" role="search">
            <div class="search-field"><label for="search-input">搜尋本期 <span lang="en">SEARCH</span></label><input id="search-input" type="search" placeholder="關鍵字、主題或來源…" autocomplete="off" maxlength="200"></div>
            <div><label for="section-filter">版別</label><select id="section-filter"><option value="">全部版別</option></select></div>
            <div><label for="kind-filter">來源型態</label><select id="kind-filter"><option value="">全部型態</option></select></div>
            <button id="reset-filters" type="button">清除條件</button>
          </form>
          <details id="topic-index" class="topic-index"><summary>主題索引 <span id="tag-total"></span></summary><div id="tag-filters" class="tag-filters" role="group" aria-label="選擇一個主題標籤"></div></details>
        </section>
        <section class="dispatches" aria-labelledby="dispatches-title">
          <div class="section-heading"><h2 id="dispatches-title" lang="en">THE DISPATCHES</h2><p id="results-count" role="status" aria-live="polite" aria-atomic="true"></p></div>
          <div id="dispatch-board" class="dispatch-board" aria-label="今日行情與新竹天氣">
            <section id="dispatch-tw" class="dispatch-card" aria-label="台股前日收盤" aria-live="polite"></section>
            <section id="dispatch-us" class="dispatch-card" aria-label="美股前日收盤" aria-live="polite"></section>
            <section id="dispatch-fx" class="dispatch-card" aria-label="台幣美元匯率" aria-live="polite"></section>
            <section id="dispatch-weather" class="dispatch-card" aria-label="新竹市今日天氣" aria-live="polite"></section>
          </div>
          <div id="stories" class="news-grid"></div>
          <p id="empty-results" class="empty-results" hidden></p>
        </section>
      </div>
    </main>
    <details id="archive" class="archive">
      <summary>往期存檔 <span lang="en">THE ARCHIVE</span> <span id="archive-count"></span></summary>
      <nav aria-label="歷史期數"><ol id="archive-list"></ol></nav>
    </details>
    <footer class="colophon"><p class="footer-brand" lang="en">THE DAILY SIGNAL</p><p><a href="#top" id="back-top">回到頁首 ↑</a></p></footer>
  </div>
</body>
</html>
